name: ai_resume_tracker
description: "ATSify"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  file_selector: ^1.0.3
  go_router: ^14.8.1
  google_generative_ai: ^0.4.7
  cronet_http: ^1.8.0
  http: ^1.4.0
  syncfusion_flutter_pdf: ^28.2.12
  docx_to_text: ^1.0.1
  google_mlkit_text_recognition: ^0.14.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  open_filex: ^4.7.0

  custom_design_system:
    path: ../custom_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/scan_files.gif
    - assets/home/
    - assets/onboarding/
